name: Trigger Smoke Tests on PR

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  trigger-smoke-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger tester repository smoke test workflow
        env:
          GH_TOKEN: ${{ secrets.SMOKE_TEST_REPO_TOKEN || github.token }}
          TESTER_OWNER: ${{ github.repository_owner }}
          TESTER_REPO: ${{ github.event.repository.name }}
          TESTER_WORKFLOW: pr-smoke-test-trigger.yml
          TESTER_REF: ${{ secrets.SMOKE_TEST_REF || github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail

          REF_NAME="${TESTER_REF}"

          echo "Triggering smoke tests in ${TESTER_OWNER}/${TESTER_REPO} on ref ${REF_NAME}"
          echo "Debug: workflow file = ${TESTER_WORKFLOW}"

          gh api \
            "/repos/${TESTER_OWNER}/${TESTER_REPO}/actions/workflows/${TESTER_WORKFLOW}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" || {
              echo "::error::Workflow not found at ${TESTER_OWNER}/${TESTER_REPO}/actions/workflows/${TESTER_WORKFLOW}"
              exit 1
            }

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "/repos/${TESTER_OWNER}/${TESTER_REPO}/actions/workflows/${TESTER_WORKFLOW}/dispatches" \
            -f "ref=${REF_NAME}" \
            -f "inputs[pr_number]=${{ github.event.pull_request.number }}" \
            -f "inputs[pr_title]=${{ github.event.pull_request.title }}" \
            -f "inputs[pr_url]=${{ github.event.pull_request.html_url }}" \
            -f "inputs[source_repo]=${{ github.repository }}" \
            -f "inputs[head_sha]=${{ github.event.pull_request.head.sha }}"
