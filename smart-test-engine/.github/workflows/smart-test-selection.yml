name: Smart Test Selection Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-engine:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart-test-engine/requirements.txt

      - name: Start engine API
        run: |
          uvicorn engine.api:app --app-dir smart-test-engine/src --host 0.0.0.0 --port 8000
