name: Smart Test Selection Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-engine:
    runs-on: self-hosted

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart-test-engine/requirements.txt

      - name: Run smart test selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: smart-test-engine/src
        run: |
          python -m engine.run_from_event
